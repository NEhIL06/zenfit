worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ─── Logging ──────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main;

    # ─── Performance ──────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    gzip               on;
    gzip_vary          on;
    gzip_proxied       any;
    gzip_comp_level    6;
    gzip_types         text/plain text/css text/xml application/json
                       application/javascript application/rss+xml
                       application/atom+xml image/svg+xml;

    # ─── Development Security Headers ─────────────────────────────
    # microphone enabled for local audio recording testing
    add_header Permissions-Policy        "camera=(), microphone=(self), geolocation=()" always;
    add_header X-Frame-Options           "SAMEORIGIN"          always;
    add_header X-Content-Type-Options    "nosniff"             always;
    add_header X-XSS-Protection          "1; mode=block"       always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # ─── Rate Limiting Zones (Generous for Dev) ───────────────────
    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=120r/m;
    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=speech_zone:10m rate=120r/m;

    # ─── Upstreams ────────────────────────────────────────────────
    upstream zenfit_app {
        server app:3000;
        keepalive 32;
    }

    upstream zenfit_speech {
        server speech-service:8080;
        keepalive 32;
    }

    # ─── Development HTTP Server (Port 80) ────────────────────────
    server {
        listen 80 default_server;
        server_name localhost 127.0.0.1 _;

        client_max_body_size 25m;

        # Custom error pages
        error_page 429 /429.html;
        error_page 500 502 503 504 /50x.html;
        location = /429.html {
            root /usr/share/nginx/html;
            internal;
        }
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }

        # ─── Liveness / Health Probe ──────────────────────
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "healthy (dev)\n";
        }

        # ─── Real-Time SSE Hub (Buffering Disabled) ───────
        location ~ ^/(api/v1/events|v1/events|api/events) {
            proxy_pass         http://zenfit_app;
            proxy_http_version 1.1;
            proxy_set_header   Connection '';
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_buffering    off;
            proxy_cache        off;
            chunked_transfer_encoding off;
            proxy_read_timeout 24h;
            proxy_send_timeout 24h;
        }

        # ─── Auth Route ───────────────────────────────────
        location ~ ^/(api/auth/login|api/users) {
            limit_req zone=auth_zone burst=10 nodelay;
            limit_req_status 429;

            proxy_pass         http://zenfit_app;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ─── Speech Microservice Route ────────────────────
        location /speech/ {
            rewrite ^/speech/(.*) /$1 break;
            limit_req zone=speech_zone burst=30 nodelay;
            limit_req_status 429;

            proxy_pass         http://zenfit_speech;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Audio streaming optimizations
            proxy_buffering    off;
            proxy_cache        off;
            chunked_transfer_encoding on;
            proxy_read_timeout 60s;
        }

        # ─── General API Routes ───────────────────────────
        location /api/ {
            limit_req zone=api_zone burst=20 nodelay;
            limit_req_status 429;

            proxy_pass         http://zenfit_app;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # ─── Static Assets (Next.js Long Cache) ───────────
        location /_next/static/ {
            proxy_pass         http://zenfit_app;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            add_header         Cache-Control "public, max-age=31536000, immutable";
        }

        # ─── Web Frontend Shell ───────────────────────────
        location / {
            proxy_pass         http://zenfit_app;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}
