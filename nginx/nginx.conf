worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ─── Logging ──────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main;

    # ─── Performance ──────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    gzip               on;
    gzip_vary          on;
    gzip_proxied       any;
    gzip_comp_level    6;
    gzip_types         text/plain text/css text/xml application/json
                       application/javascript application/rss+xml
                       application/atom+xml image/svg+xml;

    # ─── Zero-Trust Security Headers (P0 Hardened) ───────────────
    add_header Permissions-Policy        "camera=(), microphone=(self), geolocation=()" always;
    add_header X-Frame-Options           "SAMEORIGIN"          always;
    add_header X-Content-Type-Options    "nosniff"             always;
    add_header X-XSS-Protection          "1; mode=block"       always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ─── Rate Limiting Zones ──────────────────────────────────────
    # General API: 30 req/min per IP
    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=30r/m;
    # Auth endpoints: stricter — 10 req/min per IP
    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/m;
    # Speech microservice: 60 req/min per IP
    limit_req_zone $binary_remote_addr zone=speech_zone:10m rate=60r/m;

    # ─── Upstreams (Headless Microservices Plane) ────────────────
    upstream zenfit_gateway {
        server api-gateway:8080;
        keepalive 32;
    }

    upstream zenfit_speech {
        server speech-service:8081;
        keepalive 32;
    }

    # ─── HTTP → HTTPS Redirect & ACME Challenge ───────────────────
    server {
        listen 80;
        server_name _;

        # Nginx liveness probe (HTTP port 80)
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
        }

        # Let's Encrypt ACME challenge webroot
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Unconditional HTTPS redirection
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ─── Main HTTPS Server ────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name zenfit.app www.zenfit.app localhost;

        # TLS Certificates (mounted via volume or Certbot)
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # Max upload size (for 25MB audio file transcription)
        client_max_body_size 25m;

        # Custom error pages for rate limits and upstream outages
        error_page 429 /429.html;
        error_page 500 502 503 504 /50x.html;
        location = /429.html {
            root /usr/share/nginx/html;
            internal;
        }
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }

        # ─── Liveness / Health Probe ──────────────────────
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
        }

        # ─── Real-Time SSE Hub (Buffering Disabled) ───────
        location ~ ^/(api/v1/events|v1/events|api/events) {
            proxy_pass         http://zenfit_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Connection '';
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Section 9.1.A: Prevent Nginx from buffering SSE streams
            proxy_buffering    off;
            proxy_cache        off;
            chunked_transfer_encoding off;

            # Keep connection open for long-lived server events
            proxy_read_timeout 24h;
            proxy_send_timeout 24h;
        }

        # ─── Microservices API Gateway Routes (/v1/) ──────
        location /v1/ {
            proxy_pass         http://zenfit_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # ─── Auth Route: Strict Edge Rate Limiting ────────
        location ~ ^/(api/auth/login|api/users) {
            limit_req zone=auth_zone burst=5 nodelay;
            limit_req_status 429;

            proxy_pass         http://zenfit_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            # Section 9.1.B: Overwrite client IP to prevent spoofing
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ─── Speech Microservice Route (Binary Audio Stream) 
        location /speech/ {
            rewrite ^/speech/(.*) /$1 break;
            limit_req zone=speech_zone burst=20 nodelay;
            limit_req_status 429;

            proxy_pass         http://zenfit_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            # Section 9.1.B: Overwrite client IP to prevent spoofing
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Audio streaming optimizations (Section 11.1)
            proxy_buffering    off;
            proxy_cache        off;
            chunked_transfer_encoding on;
            proxy_read_timeout 60s;
        }

        # ─── General API Routes (Routed through Gateway) ──
        location /api/ {
            limit_req zone=api_zone burst=10 nodelay;
            limit_req_status 429;

            proxy_pass         http://zenfit_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            # Section 9.1.B: Overwrite client IP to prevent spoofing
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # ─── Headless Gateway Status / Root Route ────────
        location / {
            proxy_pass         http://zenfit_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            # Section 9.1.B: Overwrite client IP to prevent spoofing
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}
