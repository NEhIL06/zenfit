worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ─── Logging ──────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ─── Performance ──────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    gzip               on;
    gzip_vary          on;
    gzip_proxied       any;
    gzip_comp_level    6;
    gzip_types         text/plain text/css text/xml application/json
                       application/javascript application/rss+xml
                       application/atom+xml image/svg+xml;

    # ─── Security Headers ─────────────────────────────────────────
    add_header X-Frame-Options           "SAMEORIGIN"          always;
    add_header X-Content-Type-Options    "nosniff"             always;
    add_header X-XSS-Protection          "1; mode=block"       always;
    add_header Referrer-Policy           "strict-origin"       always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ─── Rate Limiting zones ──────────────────────────────────────
    # General API: 30 req/min per IP
    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=30r/m;
    # Auth endpoints: stricter — 10 req/min per IP
    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/m;

    # ─── Upstream ─────────────────────────────────────────────────
    upstream zenfit_app {
        server app:3000;
        keepalive 32;
    }

    # ─── HTTP → HTTPS redirect ────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Let's Encrypt ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ─── Main HTTPS server ────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name zenfit.app www.zenfit.app;

        # SSL (replace with your cert paths or Let's Encrypt output)
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # Max upload size (for audio transcription)
        client_max_body_size 25m;

        # ─── Auth route: extra rate limiting ──────────────
        location ~ ^/(api/auth/login|api/users) {
            limit_req zone=auth_zone burst=5 nodelay;
            limit_req_status 429;

            proxy_pass         http://zenfit_app;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # ─── General API routes ───────────────────────────
        location /api/ {
            limit_req zone=api_zone burst=10 nodelay;
            limit_req_status 429;

            proxy_pass         http://zenfit_app;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_cache_bypass $http_upgrade;
        }

        # ─── Static assets — long cache ───────────────────
        location /_next/static/ {
            proxy_pass         http://zenfit_app;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            add_header         Cache-Control "public, max-age=31536000, immutable";
        }

        # ─── Everything else ──────────────────────────────
        location / {
            proxy_pass         http://zenfit_app;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
