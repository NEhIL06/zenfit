name: ZenFit CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

concurrency:
  group: zenfit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ─── How deployments work ─────────────────────────────────────────────────────
#
# This pipeline handles CI (quality + build validation).
# CD (deployment) is handled by Vercel's native GitHub integration, which
# automatically deploys every push to main after this pipeline passes.
#
# This avoids duplicating deployment logic and removes the need to manage
# VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID in GitHub Secrets.
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  # ─── Stage 1: Quality Gate ────────────────────────────────────────────────
  # Runs on every push and every PR. All checks must pass before Vercel deploys.
  quality:
    name: Quality Gate (Lint · Type · Test · Audit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Type Check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Security Audit (block critical vulnerabilities)
        run: npm audit --audit-level=critical
        # Temporary threshold: high/moderate advisories remain in upstream
        # Next.js/LangChain/Google SDK/Recharts dependencies with no standard
        # npm fix available. Critical advisories must stay at zero.

      - name: Run Unit & Integration Tests (Vitest)
        run: npm run test
        env:
          # Minimal mock env vars — lets tests run without hitting real APIs.
          # These are NOT real secrets; they are test stubs.
          JWT_SECRET: "ci_test_jwt_secret_at_least_32_characters_long"
          UPSTASH_REDIS_REST_URL: "https://test.upstash.io"
          UPSTASH_REDIS_REST_TOKEN: "test_token"
          ENABLE_GEMINI_IMAGE: "false"
          NODE_ENV: "test"

  # ─── Stage 2: Build ───────────────────────────────────────────────────────
  # Verifies the production build compiles without errors.
  # If this passes, Vercel's native integration will deploy automatically.
  build:
    name: Build (Next.js Production)
    runs-on: ubuntu-latest
    needs: quality  # Only build if the quality gate passes

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Project
        run: npm run build
        env:
          JWT_SECRET: "ci_build_jwt_secret_at_least_32_characters_long"
          UPSTASH_REDIS_REST_URL: "https://test.upstash.io"
          UPSTASH_REDIS_REST_TOKEN: "test_token"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
          NODE_ENV: "production"
