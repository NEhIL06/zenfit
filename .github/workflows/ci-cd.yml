name: ZenFit CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: zenfit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Stage 1: Quality Gate 
  quality:
    name: Quality Gate (Lint · Type · Test · Audit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Type Check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Security Audit (block critical vulnerabilities)
        run: npm audit --audit-level=critical
      
      - name: Run Unit & Integration Tests (Vitest)
        run: npm run test
        env:
          JWT_SECRET: "ci_test_jwt_secret_at_least_32_characters_long"
          UPSTASH_REDIS_REST_URL: "https://test.upstash.io"
          UPSTASH_REDIS_REST_TOKEN: "test_token"
          ENABLE_GEMINI_IMAGE: "false"
          NODE_ENV: "test"

  # ─── Stage 2: Build
  build:
    name: Build (Next.js Production)
    runs-on: ubuntu-latest
    needs: quality  

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Project
        run: npm run build
        env:
          JWT_SECRET: "ci_build_jwt_secret_at_least_32_characters_long"
          UPSTASH_REDIS_REST_URL: "https://test.upstash.io"
          UPSTASH_REDIS_REST_TOKEN: "test_token"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
          NODE_ENV: "production"
