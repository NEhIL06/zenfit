name: ZenFit CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: zenfit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Stage 1: Web Frontend Quality Gate ───
  web-quality:
    name: Web Quality Gate (Lint · Type · Test · Audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Type Check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Security Audit (block critical vulnerabilities)
        run: npm audit --audit-level=critical
      
      - name: Run Unit & Integration Tests (Vitest)
        run: npm run test
        env:
          JWT_SECRET: "ci_test_jwt_secret_at_least_32_characters_long"
          UPSTASH_REDIS_REST_URL: "https://test.upstash.io"
          UPSTASH_REDIS_REST_TOKEN: "test_token"
          ENABLE_GEMINI_IMAGE: "false"
          NODE_ENV: "test"

  # ─── Stage 2: Web Build ───
  web-build:
    name: Web Build (Next.js Production)
    runs-on: ubuntu-latest
    needs: web-quality
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Project
        run: npm run build
        env:
          JWT_SECRET: "ci_build_jwt_secret_at_least_32_characters_long"
          UPSTASH_REDIS_REST_URL: "https://test.upstash.io"
          UPSTASH_REDIS_REST_TOKEN: "test_token"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
          NODE_ENV: "production"

  # ─── Stage 3: Speech Microservice Quality Gate ───
  speech-service:
    name: Speech Service (Go Test · Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/speech-service

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache-dependency-path: services/speech-service/go.mod

      - name: Run Unit & Integration Tests
        run: go test -v -race ./...

      - name: Build Production Binary
        run: CGO_ENABLED=0 GOOS=linux go build -ldflags="-s -w" -o speech-service ./cmd/server

  # ─── Stage 4: API Gateway Microservice Gate ───
  api-gateway:
    name: API Gateway (Go Test · Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api-gateway

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache-dependency-path: services/api-gateway/go.mod

      - name: Run Unit & Integration Tests
        run: go test -v -race ./...

      - name: Build Production Binary
        run: CGO_ENABLED=0 GOOS=linux go build -ldflags="-s -w" -o api-gateway ./cmd/server

  # ─── Stage 5: AI Engine Microservice Gate ───
  ai-engine:
    name: AI Engine (Python Pytest · Validation)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-engine

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: services/ai-engine/requirements.txt

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Test Suite
        run: pytest -v tests/
        env:
          ENVIRONMENT: "test"

  # ─── Stage 6: Auth & Core Microservice Gate ───
  auth-service:
    name: Auth & Core Service (Vitest · Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/auth-service

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/auth-service/package.json

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Tests (Vitest)
        run: npm test

      - name: Build Production TypeScript
        run: npm run build
